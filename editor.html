<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Spy Mouse - Level Editor</title>
<link rel="stylesheet" href="styles.css" />
<style>
  #edapp { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #edbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px; background: #1b232c; border-bottom: 1px solid rgba(255,255,255,.1); z-index: 2; }
  #edbar label { font-size: 13px; color: var(--muted); }
  #edbar select, #edbar input { background: #10161c; color: #eaf0f5; border: 1px solid rgba(255,255,255,.15); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
  #edbar input { width: 70px; }
  .tool { padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.05); color: #eaf0f5; font-size: 13px; cursor: pointer; }
  .tool.active { background: var(--accent); color: #1b1400; border-color: transparent; }
  #edcanvasWrap { position: relative; flex: 1; overflow: hidden; }
  #edcanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #edpanel { position: absolute; right: 8px; bottom: 8px; width: min(360px, 46vw); background: rgba(16,22,28,.94); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 10px; z-index: 3; }
  #edjson { width: 100%; height: 150px; background: #0b0f13; color: #9ff0e4; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; font-family: ui-monospace, monospace; font-size: 11px; }
  #edhint { position: absolute; left: 8px; bottom: 8px; font-size: 12px; color: var(--muted); background: rgba(16,22,28,.8); padding: 6px 10px; border-radius: 8px; z-index: 3; }
</style>
</head>
<body>
<div id="edapp">
  <div id="edbar">
    <label>Map <select id="mapSel"></select></label>
    <label>id <input id="fId" value="map10" /></label>
    <label>num <input id="fNum" value="1-1" /></label>
    <label>theme <input id="fTheme" value="house" /></label>
    <button class="tool active" data-tool="mouse">Mouse</button>
    <button class="tool" data-tool="exit">Exit</button>
    <button class="tool" data-tool="cheese">Cheese</button>
    <button class="tool" data-tool="cat">Cat</button>
    <button class="tool" data-tool="erase">Erase</button>
    <button class="tool" id="btnUndo">Undo</button>
    <button class="tool" id="btnClear">Clear</button>
    <button class="tool" id="btnLoad">Load JSON</button>
    <button class="tool" id="btnCopy">Copy</button>
    <button class="tool" id="btnDownload">Download</button>
  </div>
  <div id="edcanvasWrap">
    <canvas id="edcanvas"></canvas>
    <div id="edhint">Cat tool: drag to draw its patrol route. Click to place a stationary cat.</div>
    <div id="edpanel"><textarea id="edjson" spellcheck="false"></textarea></div>
  </div>
</div>
<script type="module" src="src/editor.js"></script>
</body>
</html>
